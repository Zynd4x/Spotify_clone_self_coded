<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/reicon@latest/cdn/reicon.js"></script>
    
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');


        body {
            margin: 0;
            padding: 0;
            background-color: rgb(7, 7, 7);
            font-family: "Oswald", sans-serif;
            height: 100vh;
        }

        .body {
            display: grid;
            grid-template: 
                "head head head"
                "nav nav nav" 1fr 
                "play play play"  
                / auto 1fr;
            grid-template-columns: 420px minmax(0, 1fr) 420px;
            gap: 8px;
        }

        .header {
            display: grid;
            grid-template-columns: 420px auto 420px;
            grid-area: head;
        }

        .titel {
            
            
            color: rgba(255, 255, 255, 0.89);
            padding: 10px;
            margin: 0;
            font-size: 30px;
        }

        .searchbar {
            display: flow-root;
            width: 200px;
            height: 45px;
            border-radius: 30px;
            border: none;
            background-color: rgb(39, 39, 39);
            font-family: "Oswald";
            font-size: 17px;
            font-weight: 700;
        }

        .searchebar-container {
            display: flex;
            
            margin: auto;
            align-items: center;
        }

        .searchebar-container input {
            flex: 1;
        }

        .searchbar-icons {
            display: flex;
           
        }

        .search-icon, .songs-folder-icon {
            
            filter: invert(40%);
        }

        .songs-folder-icon {
            border-left: solid 2px grey;
            padding: 0 10px;
        }


        .nav-1 {
            overflow: hidden;
        }


        .nav-1, .nav-2, .nav-3 {
            width: auto;
            min-width: 0;
            max-width: none;
            max-height: 640px;
            box-sizing: border-box;
            background-color: rgb(39, 39, 39);
            border-radius: 20px;
            color: white;
            
        }

        .nav {
           display: grid;
           grid-template-columns: 420px minmax(0, 1fr) 420px;
           width: 100%;
           gap: 8px;
        }

         .sidebar {
            width: 100%;
            grid-area: nav;
        }

        .nav-header {
            padding: 10px 16px 8px 16px;
            position: relative;
            overflow-x: hidden;
        }
      

        .nav-header-title {
            display: flex; 
            margin-right: 120px;
            align-items: center;
            min-width: 0;
            gap: 4px;
        }

        .nav-header-title-text {
            font-size: 20px;
        }

        .nav-header-content {
            display: flex;
            flex-direction: row;
            gap: 8px;
            font-size: 16px;
            height: 60px;
            
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            
        }

        .nav-add-btn {
            display: flex;
            width: max-content;
            align-items: center;
            justify-content: center;
            min-block-size: 35px;
            min-inline-size: 35px;
            height: 40px;
            padding: 8px 16px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 20px;
            font-family: "Oswald", sans-serif;
            background-color: rgb(59, 59, 59);
            color: rgba(245, 245, 245, 0.89);
        }

        .nav-add-button-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            filter: invert(70%);
        }

        .nav-button-arrow {
            height: 30px;
            cursor: pointer;
            filter: invert(70%);
            padding: 16px;
        }

        .nav-btn-2 {
            display: flex;
            gap: 6px;
        }

        .btn-2{
            font-family: "Oswald", sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 4px 18px;
            border-radius: 40px;
            border: none;
            background-color: rgb(59, 59, 59);
            color: rgba(245, 245, 245, 0.89);
        }

        .nav-icons-2 {
            display: flex;
            
        }

        .nav-icon-1, .nav-icon-2 {
            display: flex; 
            position: absolute;
            background-color: rgb(255, 255, 255);
            border-radius: 20px;
            width: 34px;
            filter: invert(60%);
            
        }

       .player {
        display: grid;
        grid-template-columns: 420px auto 420px;
        grid-area: play;
        align-items: center;
        margin: 10px;
       }

       .play-1 {
        display: flex;
        column-gap: 8px;
        margin-left: 8px;
       }

       .play-2 {
        display: flex;
        align-items: center;
        margin: auto;
        column-gap: 12px;
       }

       .play-3 {
        display: flex;
        margin-left: auto;
        column-gap: 10px;
       }
        
    </style>
</head>

                                <button class="btn-2">Alben</button>
                                <button class="btn-2">Podcasts</button>
                                <button class="btn-2">Hörbücher</button>
                            </div>
                        </div>
                    </header>
                </div>
                <div class="nav-2">

                </div>
                <div class="nav-3">

                </div>
            </nav>
